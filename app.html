<title>NephroRx Prescription Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: clinic-desk split — patient list rail on the left, one scrolling visit sheet on the right; collapses to one column on phones */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#18222b; --muted:#5d6872; --line:#dbe0dd; --soft:#eef0ee;
  --accent:#8c2f47; --accent-ink:#ffffff; --accent-soft:#f6e9ed;
  --hi:#b6420f; --lo:#1f55c7; --ok:#2f7a4f;
  --paper:#ffffff; --paper-ink:#111111; --paper-line:#c9c9c9;
  --f-head:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121619; --panel:#1a2025; --ink:#e5e9ec; --muted:#9aa5ae; --line:#2b333a; --soft:#20272d;
  --accent:#e0839b; --accent-ink:#1a0a10; --accent-soft:#3a2229;
  --hi:#f08a5d; --lo:#8db3ff; --ok:#79c79a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121619; --panel:#1a2025; --ink:#e5e9ec; --muted:#9aa5ae; --line:#2b333a; --soft:#20272d;
  --accent:#e0839b; --accent-ink:#1a0a10; --accent-soft:#3a2229;
  --hi:#f08a5d; --lo:#8db3ff; --ok:#79c79a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--f-head);font-size:20px;letter-spacing:.01em}
.brand b span{color:var(--accent)}
.brand small{color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line);background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px}
.main{padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.inp{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;width:100%}
.inp:focus{border-color:var(--accent);outline:none}
textarea.inp{resize:vertical;min-height:60px}
.plist{display:flex;flex-direction:column;gap:2px;overflow:auto}
.pitem{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;text-align:left;background:none}
.pitem:hover{background:var(--soft)}
.pitem.on{background:var(--accent-soft);border-color:var(--accent)}
.pitem .n{font-weight:600}
.pitem .m{grid-column:1/-1;color:var(--muted);font-size:12px;font-family:var(--f-data)}
.tag{font-size:11px;padding:1px 6px;border-radius:10px;background:var(--soft);color:var(--muted);align-self:center;letter-spacing:.03em}
.sheet{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.card>h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;text-transform:none;letter-spacing:0}
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.phead h1{font-size:24px}
.meta{font-family:var(--f-data);color:var(--muted);font-size:13px}
.visits{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:4px 11px;cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vit{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f .inp{color:var(--ink);font-size:14px}
.hint{color:var(--muted);font-size:12px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.labs{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:100%}
table.labs th,table.labs td{border-bottom:1px solid var(--line);padding:0;text-align:left}
table.labs thead th{background:var(--soft);font-weight:600;font-size:12px;padding:6px 8px;white-space:nowrap;position:sticky;top:0}
table.labs th.tn{position:sticky;left:0;background:var(--panel);z-index:1;padding:5px 10px;font-weight:500;white-space:nowrap;min-width:150px;border-right:1px solid var(--line)}
table.labs thead th.tn{background:var(--soft);z-index:2}
table.labs th.tn small{color:var(--muted);font-weight:400;margin-left:4px;font-family:var(--f-data);font-size:11px}
table.labs tr.grp th{background:var(--bg);color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;position:sticky;left:0}
table.labs td input{width:84px;border:0;background:transparent;padding:6px 8px;font-family:var(--f-data);font-size:13px}
table.labs td input:focus{background:var(--accent-soft);outline:none}
table.labs td.calc{font-family:var(--f-data);font-size:13px;padding:6px 8px;color:var(--muted)}
td.hi input,td.hi{color:var(--hi)!important;font-weight:600}
td.lo input,td.lo{color:var(--lo)!important;font-weight:600}
td.new input{background:var(--accent-soft)}
.colh{display:flex;align-items:center;gap:6px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 3px;font-size:13px}
.x:hover{color:var(--hi)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rx{width:100%;border-collapse:collapse}
.rx td{padding:4px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.rx td.no{font-family:var(--f-data);color:var(--muted);width:24px}
.rx input,.rx select{border:1px solid transparent;background:transparent;border-radius:4px;padding:5px 6px;width:100%}
.rx input:hover,.rx select:hover{border-color:var(--line)}
.rx input:focus,.rx select:focus{border-color:var(--accent);outline:none}
.rx .drug{font-weight:600;min-width:200px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sugg button{border:1px dashed var(--line);background:var(--panel);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:13px}
.sugg button:first-child{border-style:solid;border-color:var(--accent)}
.actions{position:sticky;bottom:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.actions .st{margin-right:auto;color:var(--muted);font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(10,14,18,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding-block:calc(env(safe-area-inset-top,0px) + 24px) 24px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.modal{background:var(--panel);border-radius:10px;padding:18px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px}
.modal.wide{max-width:880px;background:var(--soft)}
.modal h3{font-size:19px}
.mrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:max-content}
.seg button{border:0;background:var(--panel);padding:7px 16px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.warn{background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:8px 12px;font-size:13px}
.empty{max-width:640px;margin:40px auto;text-align:left;display:flex;flex-direction:column;gap:14px}
.empty h1{font-size:30px}
.empty ol{margin:0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.back{display:none}
/* Paper — always light, it is a printed page */
.paper{background:var(--paper);color:var(--paper-ink);width:100%;max-width:794px;margin:0 auto;padding:28px 34px;font-size:12.5px;line-height:1.4;box-shadow:0 2px 12px rgba(0,0,0,.15);font-family:var(--f-body)}
.paper .lh{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid var(--paper-ink);padding-bottom:10px;flex-wrap:wrap}
.paper .lh .dr{font-family:var(--f-head);font-size:21px;font-weight:700}
.paper .lh .r{text-align:right}
.paper .pt{display:flex;flex-wrap:wrap;gap:4px 22px;padding:8px 0;border-bottom:1px solid var(--paper-line)}
.paper .pt b{font-weight:600}
.paper h4{font-family:var(--f-head);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:12px 0 4px}
.paper table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.paper th,.paper td{border:1px solid var(--paper-line);padding:3px 6px;text-align:left;vertical-align:top}
.paper th{background:#f1f1f1;font-weight:600}
.paper .lt td{font-family:var(--f-data);font-size:11.5px}
.paper .lt td:first-child{font-family:var(--f-body)}
.paper .rxsym{font-family:Georgia,serif;font-size:22px;font-weight:700;margin:12px 0 2px}
.paper .legend{font-size:10.5px;color:#444;margin-top:3px}
.paper ul{margin:2px 0;padding-left:18px}
.paper .sig{display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px;gap:20px;flex-wrap:wrap}
.paper .sig .r{text-align:right;border-top:1px solid var(--paper-ink);padding-top:4px;min-width:200px}
.paper .foot{border-top:1px solid var(--paper-line);margin-top:14px;padding-top:6px;font-size:10.5px;color:#444}
.paper .links{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--paper-line);margin-top:12px;padding-top:8px;font-size:11px}
.paper .links .qr{text-align:center;font-size:10px}
.paper .links .qr img{width:78px;height:78px;image-rendering:pixelated;display:block;margin:0 auto 2px}
code.lk{display:block;padding:8px;background:var(--soft);border-radius:6px;font-family:var(--f-data);font-size:12px;word-break:break-all;user-select:all}
#printArea{display:none}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumb{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0;overflow:hidden;text-align:left;cursor:pointer;display:flex;flex-direction:column;color:var(--ink)}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--soft)}
.thumb span{padding:6px 8px;font-size:12px;line-height:1.35}
.rp-ways{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card2,.rev{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:20px;height:20px;flex:none}
.sugg .pinbtn{border-style:dashed;color:var(--muted)}
.fullimg{max-width:100%;max-height:65vh;object-fit:contain;background:var(--soft);border-radius:6px;align-self:center}
.paper .loc{color:#222;font-size:.96em}.paper .sub{color:#555;font-size:11px}
.prevtag{font-size:10px;color:var(--accent);margin-left:2px;letter-spacing:.04em}
@media (max-width:720px){.rp-ways{grid-template-columns:1fr}}
@media (max-width:1100px){.layout{grid-template-columns:240px minmax(0,1fr)}}
.rx{min-width:700px}
/* Touch screens (iPad, phones): larger targets, 16px fields so iOS never zooms on tap */
@media (pointer:coarse){
  .inp,label.f .inp,.rx input,.rx select,table.labs td input{font-size:16px}
  .btn{min-height:40px;padding:8px 14px}.btn.sm{min-height:36px}
  .chip{padding:7px 13px;font-size:14px}
  .x{padding:6px 8px;font-size:16px}
  table.labs td input{width:90px;padding:9px 8px}
  .pitem{padding:11px 10px}
  .sugg button{padding:8px 12px;font-size:14px}
  .seg button{padding:9px 18px}
}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .layout.has-p .side{display:none}
  .layout:not(.has-p) .main{display:none}
  .side{border-right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .back{display:inline-block}
  .grid2{grid-template-columns:1fr}
  .brand small{display:none}
  .paper{padding:18px}
}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  body::before,.top,.layout,.overlay{display:none!important}
  #printArea{display:block!important}
  #printArea .paper{box-shadow:none;padding:0;max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="brand"><b>Nephro<span>Rx</span></b><small>Prescription desk</small></div>
  <button class="btn pri" data-a="newPatient">+ New patient</button>
  <button class="btn" data-a="settings">Clinic settings</button>
</header>
<div class="layout" id="layout">
  <aside class="side">
    <input class="inp" id="search" placeholder="Search name, phone or UHID" autocomplete="off">
    <div class="hint" id="pcount"></div>
    <div class="plist" id="plist"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="printArea"></div>
<div class="overlay" id="ov" hidden><div class="modal" id="modal"></div></div>

function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(db));setStatus('Saved')}catch(e){storageOK=false;setStatus('Not saved: browser storage is off')}},300)}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function today(){const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function dmy(iso,short){if(!iso)return '';const [y,m,d]=iso.split('-');return short?`${d}/${m}/${y.slice(2)}`:`${d}/${m}/${y}`}
function validISO(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T00:00:00'))}
function ageAt(p,iso){const base=Number(p.age);if(!base)return 0;const yrs=(new Date(iso)-new Date(p.createdAt.slice(0,10)))/(365.25*864e5);return Math.max(0,Math.floor(base+(yrs>0?yrs:0)))}
function egfr(cr,age,sex){cr=parseFloat(cr);if(!cr||!age||(sex!=='M'&&sex!=='F'))return '';
  const f=sex==='F',k=f?0.7:0.9,a=f?-0.241:-0.302;
  const v=142*Math.pow(Math.min(cr/k,1),a)*Math.pow(Math.max(cr/k,1),-1.2)*Math.pow(0.9938,age)*(f?1.012:1);return String(Math.round(v))}
function flag(t,v){const n=parseFloat(String(v).replace(/[<>]/g,''));if(isNaN(n))return '';if(t.hi!=null&&n>t.hi)return 'hi';if(t.lo!=null&&n<t.lo)return 'lo';return ''}
function allTests(){return TESTS.concat((db.settings.customTests||[]).map(c=>({g:'Other',k:c.k,l:c.l,u:c.u||''})))}
function labVal(p,date,k){if(k==='egfr'){const c=(p.labs[date]||{}).cr;return egfr(c,ageAt(p,date),p.sex)}return (p.labs[date]||{})[k]||''}
function freqText(f){const m={'1-0-0':'Morning','0-1-0':'Afternoon','0-0-1':'Night','1-0-1':'Morning & night','1-1-1':'Three times','1-1-1-1':'Four times','2-2-2':'2 tabs three times','½-0-0':'Half tab morning'};return m[f]||''}

function renderLabs(){
  const p=P(cur.pid);const dates=Object.keys(p.labs).sort();
  if(!dates.length){$('#labwrap').innerHTML='<div style="padding:14px" class="hint">No reports yet. Pick the report date above and press “Add column”, or paste the report text.</div>';return}
  let g='';let rows='';
  allTests().forEach(t=>{
    if(t.g!==g){g=t.g;rows+=`<tr class="grp"><th colspan="${dates.length+1}">${esc(g)}</th></tr>`}
    rows+=`<tr><th class="tn">${esc(t.l)}<small>${esc(t.u)}</small></th>`+dates.map(d=>{
      const val=labVal(p,d,t.k);const fl=flag(t,val);const nw=stage[d]&&stage[d][t.k]?' new':'';

       `<td class="${fl}${nw}"><input enterkeyhint="next" aria-label="${esc(t.l)} ${dmy(d)}" inputmode="decimal" data-lab="${d}" data-k="${t.k}" value="${esc(val)}"></td>`}).join('')+'</tr>';

}

function drugPool(){const mine=(db.settings.myDrugs||[]).filter(m=>!FORMULARY.some(f=>f[0]===m[0]));return mine.concat(FORMULARY)}
function renderSugg(q){
  q=q.trim().toLowerCase();const pool=drugPool();
  const U=drugUse();const used=d=>(U[d[0]]&&U[d[0]].n)||0;
  const inRx=new Set(curVisit().rx.map(r=>r.drug));
  const hits=q?pool.filter(d=>d[0].toLowerCase().replace(/^(tab|cap|inj|sachet|syp)\.?\s*/,'').includes(q)||d[0].toLowerCase().includes(q)).sort((a,b)=>used(b)-used(a)).slice(0,7)
    :pool.filter(d=>used(d)>0&&!inRx.has(d[0])).sort((a,b)=>used(b)-used(a)).slice(0,8);
  $('#sugg').innerHTML=(!q&&hits.length?'<span class="hint" style="align-self:center">Your usual:</span>':'')+hits.map((d,i)=>`<button data-a="addDrug" data-i="${pool.indexOf(d)}">${esc(d[0])} <span class="hint">${esc(d[1])}</span></button>`).join('')+
   (q&&!hits.some(h=>h[0].toLowerCase()===q)?`<button data-a="addDrugFree">Add “${esc($('#drug_q').value.trim())}” as typed</button>`:'');
}
function addRx(d){const v=curVisit();const u=drugUse()[d[0]]||{};const r={drug:d[0],freq:u.freq||d[1]||'1-0-0',timing:u.timing||d[2]||'After food',dur:u.dur||d[3]||'1 month',note:''};
  v.rx.push(r);noteDrug(r);drugUse()[d[0]].n++;touchVisit();renderRx();
  const q=$('#drug_q');q.value='';renderSugg('');q.focus()}

  const usesFreq=v.rx.some(r=>/^[\d½]/.test(r.freq));
  return `<div class="paper" lang="${lang==='en'?'en':lang}"${loc?` style="font-family:var(--f-body),'${LFONT[lang]}'"`:''}>
   <div class="lh"><div><div class="dr">${esc(s.dr)}</div><div>${esc(s.quals)}</div><div>${esc(s.reg)}</div></div>
     <div class="r"><b>${esc(s.clinic)}</b><div>${esc(s.address)}</div><div>${esc(s.phone)}</div><div>${esc(s.timings)}</div></div></div>

function parseCSV(t){const rows=[];let row=[],f='',q=false;t=t.replace(/^\uFEFF/,'');

    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else f+=c}

}

/* ---------- report text reader ---------- */
function parseReport(text){
  const out={};let date='';
  const dre=/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4}|\d{2})\b/g;
  const dm=dre.exec(text);
  if(dm){let y=dm[3].length===2?'20'+dm[3]:dm[3];const iso=`${y}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`;if(validISO(iso)&&+dm[2]<=12)date=iso}
  const clean=text.replace(dre,' ');
  clean.split(/[\n;|]+/).forEach(seg=>{
    let s=seg;let guard=0;
    while(s&&guard++<20){
      let best=null;
      for(const [k,re] of ALIAS){const m=re.exec(s);if(m&&(!best||m.index<best.m.index))best={k,m}}
      if(!best)break;
      let rest=s.slice(best.m.index+best.m[0].length);
      if(best.k==='alb'&&/^\s*[\/:]?\s*(globulin|\/\s*g\b|ratio)/i.test(rest)){s=rest;continue}
      const nre=/([<>]?\d+(?:\.\d+)?)(\s*[-–]\s*\d+(?:\.\d+)?)?/g;let nm,val=null,end=0;
      while((nm=nre.exec(rest))){if(nm[2]){continue}val=nm[1];end=nm.index+nm[0].length;break}
      if(val==null){s=rest;continue}
      // stop if another test name sits between the label and the number
      const between=rest.slice(0,end-val.length);
      if(ALIAS.some(([k,re])=>k!==best.k&&re.test(between))){s=rest;continue}
      let k=best.k,n=parseFloat(val.replace(/[<>]/g,''));
      if(k==='bun'){k='urea';val=String(Math.round(n*2.14))}
      if(k==='cr'&&n>25){val=(n/88.4).toFixed(2)} // µmol/L → mg/dL
      if(!(k in out))out[k]=val;
      s=rest.slice(end);
    }
  });
  return {date,values:out};
}

    const cuts=[...paper.querySelectorAll('tr,h4,li,.pt,.lh,.sig,.legend,.foot,.rxsym,.paper>div')].map(el=>Math.round((el.getBoundingClientRect().bottom-top)*scale)).sort((a,b)=>a-b);
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',compress:true});
    const W=210,H=297,margin=10,pxPerMm=canvas.width/W;
    const totalMm=canvas.height/pxPerMm;
    if(totalMm<=H*1.25){ // a little over one page: shrink to fit on a single A4 sheet
      const h=Math.min(H,totalMm),w=W*h/totalMm;
      pdf.addImage(canvas.toDataURL('image/jpeg',0.9),'JPEG',(W-w)/2,0,w,h);return pdf.output('blob');
    }
    let start=0,page=0;
    while(start<canvas.height-2){
      const avail=Math.floor((H-(page?2*margin:margin))*pxPerMm);
      let end=start+avail;
      if(end<canvas.height){const fit=cuts.filter(c=>c>start+40&&c<=end);if(fit.length)end=fit[fit.length-1]}else end=canvas.height;
      const pc=document.createElement('canvas');pc.width=canvas.width;pc.height=end-start;
      const cx=pc.getContext('2d');cx.fillStyle='#ffffff';cx.fillRect(0,0,pc.width,pc.height);cx.drawImage(canvas,0,start,canvas.width,end-start,0,0,canvas.width,end-start);
      if(page)pdf.addPage();
      pdf.addImage(pc.toDataURL('image/jpeg',0.9),'JPEG',0,page?margin:0,W,(end-start)/pxPerMm);
      start=end;page++;
    }
    if(page>1){for(let i=1;i<=page;i++){pdf.setPage(i);pdf.setFontSize(8);pdf.setTextColor(90);pdf.text(`Page ${i} of ${page}`,W-margin,H-5,{align:'right'})}}
    return pdf.output('blob');
  }finally{host.remove()}
}

    <label class="f" style="grid-column:1/-1">Note (e.g. “Right kidney 9.1 cm, raised echogenicity”)<input class="inp" id="fv_cap" value="${esc(f.caption)}"></label></div>
   <div class="mrow"><button class="btn" data-a="delFile" data-id="${f.id}">Delete</button>${ai&&aiImg?`<button class="btn" data-a="fileAI" data-id="${f.id}">Read values with AI</button>`:''}<button class="btn" data-a="close">Close</button><button class="btn pri" data-a="saveFile" data-id="${f.id}">Save</button></div>`,true)}
async function doBackup(out){const files=[];try{for(const f of await FDB.all())files.push(Object.assign({},f,{blob:await blobToDataURL(f.blob)}))}catch(e){}
  const json=JSON.stringify(Object.assign({},db,{files}));offerFile('nephrorx-backup-'+today()+'.json',json,'application/json',out)}
function dataURLToBlobSync(u){const m=String(u).match(/^data:([^;,]*)(;base64)?,(.*)$/);if(!m)return null;const bin=m[2]?atob(m[3]):decodeURIComponent(m[3]);
  const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m[1]||'image/jpeg'})}
async function restoreFiles(list){let n=0;for(const f of list||[]){const b=dataURLToBlobSync(f.blob);if(b){await FDB.put(Object.assign({},f,{blob:b}));n++}}return n}

function showTrBox(){const box=$('#tr_box');if(!box)return;const p=P(cur.pid),v=curVisit(),lang=rxLang(p);
  const need=lang!=='en'?v.advice.filter(a=>!adviceLocal(a,lang)):[];
  box.innerHTML=need.length?`<div class="warn row"><span style="flex:1;min-width:200px">${need.length} advice line${need.length>1?'s are':' is'} in English only.</span>${ai?'<button class="btn sm" data-a="trAI">Translate with AI</button>':'<span class="hint">AI translation works in the Claude app.</span>'}<span class="hint" id="tr_st"></span></div>`:''}
async function translateAdvice(){const p=P(cur.pid),v=curVisit(),lang=rxLang(p);const need=v.advice.filter(a=>!adviceLocal(a,lang));if(!need.length||!ai)return;
  const st=$('#tr_st');st.textContent='Translating…';
  try{const out=await ai.json(`Translate these instructions for a kidney patient in India into ${LANGS[lang].split('· ')[1]} (${lang}). Use simple everyday words a patient understands. Keep numbers, units and medicine names unchanged. Reply with only a JSON array of strings, in the same order.\n\n`+JSON.stringify(need),{modelTier:'default'});
    if(!Array.isArray(out)||out.length!==need.length)throw {code:'invalid_json'};
    const T=db.settings.trans[lang]=db.settings.trans[lang]||{};need.forEach((a,i)=>{if(typeof out[i]==='string'&&out[i].trim())T[a]=out[i].trim().slice(0,300)});save();
    const b=$('#paperbox');if(b)b.innerHTML=rxHTML();showTrBox();setStatus('Translated. Please check it with someone who reads the language.')}
  catch(e){if($('#tr_st'))$('#tr_st').textContent=aiErr(e)}}

/* ---------- events ---------- */
function setStatus(t){const el=$('#status');if(el)el.textContent=t}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;const v=curVisit&&cur.pid?curVisit():null;const p=P(cur.pid);
  switch(a){
  case 'newPatient':patientForm();break;
  case 'editPatient':patientForm(p);break;
  case 'settings':settingsForm();break;
  case 'close':closeModal();break;
  case 'openP':if(b.dataset.id)openPatient(b.dataset.id);break;
  case 'openV':openPatient(cur.pid,b.dataset.id);break;
  case 'newVisit':cur.vid=null;cur.draft=prefillFromLast(newDraft(cur.pid));renderSheet();break;
  case 'back':cur.pid=null;renderList();renderEmpty();break;
  case 'dx':{const d=b.dataset.v,i=v.diagnosis.indexOf(d);i<0?v.diagnosis.push(d):v.diagnosis.splice(i,1);touchVisit();renderDx();break}
  case 'adv':{const d=b.dataset.v,i=v.advice.indexOf(d);i<0?v.advice.push(d):v.advice.splice(i,1);touchVisit();renderAdvice();break}
  case 'fu':v.followUp=addDays(v.date||today(),+b.dataset.n);$('#v_fu').value=v.followUp;touchVisit();break;
  case 'addCol':{const d=$('#lab_date').value;if(!validISO(d))return;if(!p.labs[d])p.labs[d]={};save();renderLabs();
    const first=document.querySelector(`[data-lab="${d}"]`);if(first)first.focus();break}
  case 'delCol':{if(b.dataset.armed){delete p.labs[b.dataset.d];save();renderLabs()}else{b.dataset.armed='1';b.textContent='remove?';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='×'}},3000)}break}
  case 'addTest':{const raw=$('#ct_name').value.trim();if(!raw)return;const m=raw.match(/^(.*?)\s*\(([^)]*)\)\s*$/);const l=m?m[1]:raw,u=m?m[2]:'';
    const k='c_'+l.toLowerCase().replace(/[^a-z0-9]+/g,'_');if(!allTests().some(t=>t.k===k))db.settings.customTests.push({k,l,u});$('#ct_name').value='';save();renderLabs();break}
  case 'paste':pasteForm();break;
  case 'readPaste':readPaste();break;
  case 'applyPaste':applyReport();break;
  case 'readAI':readAI();break;
  case 'stopAI':if(aiCtl)aiCtl.abort();break;
  case 'rpDel':rpPhotos.splice(+b.dataset.i,1);showRpThumbs();break;
  case 'savePhotos':addFiles(rpPhotos,'Lab report',$('#pt_date').value,'').then(n=>{closeModal();setStatus(`Saved ${n} photo${n===1?'':'s'}`)});break;
  case 'viewFile':viewFile(b.dataset.id);break;
  case 'saveFile':FDB.get(b.dataset.id).then(f=>{if(!f)return;f.kind=$('#fv_kind').value;f.date=validISO($('#fv_date').value)?$('#fv_date').value:f.date;f.caption=$('#fv_cap').value.trim();return FDB.put(f)}).then(()=>{closeModal();renderFiles()});break;
  case 'delFile':if(b.dataset.armed){FDB.del(b.dataset.id).then(()=>{closeModal();renderFiles()})}else{b.dataset.armed='1';b.textContent='Tap again to delete';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Delete'}},3000)}break;
  case 'fileAI':FDB.get(b.dataset.id).then(f=>{if(f){pasteForm(f.blob);$('#pt_date').value=f.date}});break;
  case 'pick':pickPhrase(b.dataset.fl,b.dataset.t);break;
  case 'pin':{const el=document.querySelector(`[data-smart="${b.dataset.fl}"]`);const t=el&&tidy(el.value).trim();if(!t)return;const s=phr();const arr=s.pins[b.dataset.fl]=s.pins[b.dataset.fl]||[];if(!arr.includes(t))arr.unshift(t);save();renderSmart(el);setStatus('Saved as a '+FIELD_NAME[b.dataset.fl].toLowerCase()+' template');break}
  case 'unpin':{const arr=phr().pins[b.dataset.fl]||[];arr.splice(+b.dataset.i,1);save();b.closest('li').remove();break}
  case 'forgetLearned':if(b.dataset.armed){db.settings.phr={};db.settings.drugUse={};save();b.textContent='Cleared'}else{b.dataset.armed='1';b.textContent='Tap again to clear'}break;
  case 'clearRx':v.rx=[];v.repeatFrom=null;touchVisit();renderSheet();break;
  case 'trAI':translateAdvice();break;
  case 'addDrug':addRx(drugPool()[+b.dataset.i]);break;
  case 'addDrugFree':{const t=$('#drug_q').value.trim();if(!t)return;const d=[t,'1-0-0','After food','1 month'];db.settings.myDrugs.unshift(d);addRx(d);break}
  case 'rxDel':v.rx.splice(+b.dataset.i,1);touchVisit();renderRx();break;
  case 'rxUp':{const i=+b.dataset.i;if(i>0){[v.rx[i-1],v.rx[i]]=[v.rx[i],v.rx[i-1]];touchVisit();renderRx()}break}
  case 'copyLast':{const prev=visitsOf(cur.pid).find(x=>x.id!==v.id&&x.rx.length);
    if(!prev){setStatus('No earlier prescription to copy');return}
    const have=new Set(v.rx.map(r=>r.drug));prev.rx.forEach(r=>{if(!have.has(r.drug))v.rx.push(Object.assign({},r))});
    prev.diagnosis.forEach(d=>{if(!v.diagnosis.includes(d))v.diagnosis.push(d)});prev.advice.forEach(d=>{if(!v.advice.includes(d))v.advice.push(d)});
    if(!v.testsAdvised)v.testsAdvised=prev.testsAdvised;touchVisit();renderSheet();setStatus('Copied from '+dmy(prev.date));break}
  case 'saveTpl':{if(!v.rx.length){setStatus('Add medicines first, then save them as a template');return}
    openModal(`<h3>Save as template</h3><label class="f">Template name<input class="inp" id="tpl_name" autofocus placeholder="e.g. CKD 3 with diabetes"></label>
     <div class="mrow"><button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="saveTpl2">Save template</button></div>`);break}
  case 'saveTpl2':{const n=$('#tpl_name').value.trim();if(!n)return;db.settings.templates.push({id:uid(),name:n,rx:v.rx.map(r=>[r.drug,r.freq,r.timing,r.dur]),advice:v.advice.slice(),dx:v.diagnosis.slice()});save();closeModal();renderSheet();setStatus('Template saved');break}
  case 'preview':if(cur.draft)touchVisit();openModal(`<div class="row" style="justify-content:space-between"><h3>Prescription preview</h3><div class="row">
      <select class="inp" id="rx_lang" style="width:auto" aria-label="Language for the patient">${Object.entries(LANGS).map(([k,n])=>`<option value="${k}"${k===rxLang(p)?' selected':''}>${k==='en'?n:'English + '+n}</option>`).join('')}</select>
      <button class="btn pri" data-a="pdf">PDF for WhatsApp</button>${framed?'':'<button class="btn" data-a="print">Print</button>'}<button class="btn" data-a="whatsapp">WhatsApp text</button><button class="btn" data-a="close">Close</button></div></div>
      <p class="hint">“PDF for WhatsApp” makes an A4 PDF of exactly this page and opens your iPad’s share sheet, so you can pick WhatsApp and the patient.</p>
      <div id="tr_box"></div><div style="overflow-x:auto" id="paperbox">${rxHTML()}</div>`,true);ensureFont(rxLang(p));showTrBox();break;
  case 'pdf':pdfFlow();break;
  case 'pdfShare':sharePdf();break;
  case 'print':$('#printArea').innerHTML=rxHTML();window.print();break;
  case 'whatsapp':{if(cur.draft)touchVisit();let ph=(p.phone||'').replace(/\D/g,'');if(ph.length===10)ph='91'+ph;
    openModal(`<h3>Send on WhatsApp</h3><label class="f">Message (you can edit it)<textarea class="inp" id="wa_txt" rows="14">${esc(waText())}</textarea></label>
     <div class="row">${ph?`<a class="btn pri" id="wa_go" href="https://wa.me/${ph}?text=" target="_blank" rel="noopener">Open WhatsApp chat with ${esc(p.phone)}</a>`:'<span class="hint">Add the patient’s mobile number to open WhatsApp directly.</span>'}
      <button class="btn" data-a="copyWa">Copy message</button><span class="hint" id="wa_st"></span></div>
     <div class="row"><button class="btn" data-a="pdf">Make the PDF instead</button><span class="hint">Opens the share sheet: choose WhatsApp, then the patient.</span></div>
     <div class="mrow"><button class="btn" data-a="close">Close</button></div>`);
    const go=$('#wa_go');if(go){const upd=()=>go.href=`https://wa.me/${ph}?text=${encodeURIComponent($('#wa_txt').value)}`;upd();$('#wa_txt').addEventListener('input',upd)}break}
  case 'copyWa':{const t=$('#wa_txt');navigator.clipboard&&navigator.clipboard.writeText(t.value).then(()=>$('#wa_st').textContent='Copied',()=>{t.select();$('#wa_st').textContent='Selected: press Ctrl+C or long-press to copy'});if(!navigator.clipboard){t.select()}break}
  case 'saveSettings':['dr','quals','reg','clinic','address','phone','timings','footer','website','appLink','bookLink'].forEach(k=>db.settings[k]=$('#s_'+k).value.trim());
    ['website','appLink','bookLink'].forEach(k=>db.settings[k]=cleanUrl(db.settings[k]));
    db.settings.linksOnRx=$('#s_linksOnRx').checked;db.settings.linksOnWa=$('#s_linksOnWa').checked;
    db.settings.defaultLang=$('#s_defaultLang').value;db.settings.autoRepeat=$('#s_autoRepeat').checked;save();closeModal();break;
  case 'copyLink':{const t=$('#lk_tpl').textContent;const st=$('#lk_st');
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>st.textContent='Copied',()=>{getSelection().selectAllChildren($('#lk_tpl'));st.textContent='Selected: copy it from the menu'});
    else{getSelection().selectAllChildren($('#lk_tpl'))}break}
  case 'exportCsv':offerFile('nephrorx-patients-'+today()+'.csv',patientsCSV(),'text/csv',$('#csv_st'));break;
  case 'export':$('#bk').textContent='Preparing the backup (including photos)…';doBackup($('#bk'));break;
  case 'delSample':db.patients=db.patients.filter(x=>!x.sample);db.visits=db.visits.filter(x=>x.patientId!=='sample1');save();closeModal();if(cur.pid==='sample1'){cur.pid=null;renderEmpty()}renderList();break;
  }
});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden)closeModal()});
$('#search').addEventListener('input',renderList);

document.addEventListener('input',e=>{
  const t=e.target;if(!cur.pid||t.closest('#modal'))return;const v=curVisit(),p=P(cur.pid);
  if(t.dataset.smart)renderSmart(t);
  if(t.dataset.pf){p[t.dataset.pf]=t.value;save();return}
  if(t.dataset.f){const path=t.dataset.f.split('.');if(path.length===2)v[path[0]][path[1]]=t.value;else v[path[0]]=t.value;
    if(path[1]==='wt'||path[1]==='ht')$('#v_bmi').value=bmi(v);touchVisit();return}
  if(t.dataset.lab){const d=t.dataset.lab,k=t.dataset.k;p.labs[d]=p.labs[d]||{};if(t.value.trim())p.labs[d][k]=t.value.trim();else delete p.labs[d][k];
    const td=t.parentElement;const test=allTests().find(x=>x.k===k);td.classList.remove('hi','lo','new');const f=flag(test,t.value);if(f)td.classList.add(f);
    if(k==='cr'){const eg=document.getElementById('eg_'+d);if(eg){const val=labVal(p,d,'egfr');eg.textContent=val;eg.className='calc '+flag(TESTS[1],val)}}
    save();return}
  if(t.dataset.rx){v.rx[+t.dataset.rx][t.dataset.rf]=t.value;touchVisit();return}
  if(t.id==='drug_q')renderSugg(t.value);
});
document.addEventListener('focusin',e=>{const t=e.target;if(!t.dataset||!t.dataset.smart)return;
  document.querySelectorAll('.sugg[id^="sg_"]').forEach(b=>{if(b.id!=='sg_'+t.dataset.smart)b.innerHTML=''});t._old=t.value;renderSmart(t)});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.smart){const old=new Set(String(t._old||'').split(/[\n,;]+/).map(x=>x.trim()));learn(t.dataset.smart,String(t.value).split(/[\n,;]+/).map(x=>x.trim()).filter(x=>!old.has(x)).join('\n'));t._old=t.value}
  if(t.id==='rx_lang'){const p=P(cur.pid);p.lang=t.value;save();ensureFont(t.value).then(()=>{const b=$('#paperbox');if(b)b.innerHTML=rxHTML()});const b=$('#paperbox');if(b)b.innerHTML=rxHTML();showTrBox()}
  if(t.dataset.rx&&t.tagName==='SELECT'){const r=curVisit().rx[+t.dataset.rx];r[t.dataset.rf]=t.value;noteDrug(r);touchVisit()}
  if(t.id==='tpl'&&t.value){const tp=db.settings.templates.find(x=>x.id===t.value),v=curVisit();const have=new Set(v.rx.map(r=>r.drug));
    tp.rx.forEach(r=>{if(!have.has(r[0]))v.rx.push({drug:r[0],freq:r[1],timing:r[2],dur:r[3],note:''})});
    (tp.advice||[]).forEach(a=>{const s=typeof a==='number'?ADVICE[a]:a;if(s&&!v.advice.includes(s))v.advice.push(s)});(tp.dx||[]).forEach(d=>{if(!v.diagnosis.includes(d))v.diagnosis.push(d)});touchVisit();t.value='';renderRx();renderAdvice();renderDx();setStatus('Template applied: '+tp.name)}
});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key!=='Enter')return;
  if(t.id==='drug_q'){e.preventDefault();const first=$('#sugg button');if(first)first.click();return}
  if(t.id==='dx_add'||t.id==='adv_add'){e.preventDefault();const val=t.value.trim();if(!val)return;const v=curVisit();const arr=t.id==='dx_add'?v.diagnosis:v.advice;if(!arr.includes(val))arr.push(val);learn(t.id==='dx_add'?'dx':'adv',val);t.value='';touchVisit();t.id==='dx_add'?renderDx():renderAdvice();return}
  if(t.id==='ct_name'){e.preventDefault();document.querySelector('[data-a="addTest"]').click();return}
  if(t.dataset.lab){e.preventDefault();const cells=[...document.querySelectorAll(`[data-lab="${t.dataset.lab}"]`)];const n=cells[cells.indexOf(t)+1];if(n){n.focus();n.select()}}
});

try{if(!framed&&navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
renderList();
if(!storageOK)setStatus('Browser storage is off');
renderEmpty();
handleLink();
})();
</script>
